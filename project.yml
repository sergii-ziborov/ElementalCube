name: ElementalCube
options:
  bundleIdPrefix: com.weavatrix
  deploymentTarget:
    iOS: '16.0'
packages:
  ElementalCube:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  ElementalCube-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/ElementalCube
        excludes: [Shaders.metal.txt]
      - path: Sources/ElementalCube/Shaders.metal.txt
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ElementalCube
        product: ElementalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weavatrix.elementalcube
        DEVELOPMENT_TEAM: XMS5ZC28UJ
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '12'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ElementalCube
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
  ElementalCube-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/ElementalCubeUITests]
    dependencies:
      - target: ElementalCube-iOS
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.weavatrix.elementalcube.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ElementalCube-iOS:
    build:
      targets:
        ElementalCube-iOS: all
    test:
      targets: [ElementalCube-UITests]
